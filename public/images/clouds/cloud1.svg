<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    .cloud {
      fill: #FFFFFF;
      animation: float 10s infinite;
    }

    @keyframes float {
      0% { transform: translate(0, 0); }
      50% { transform: translate(20px, -10px); }
      100% { transform: translate(0, 0); }
    }
  </style>

  <g class="cloud">
    <ellipse cx="50" cy="50" rx="40" ry="20" />
    <ellipse cx="90" cy="50" rx="40" ry="20" />
    <ellipse cx="70" cy="70" rx="40" ry="20" />
  </g>

  <g class="cloud">
    <ellipse cx="150" cy="100" rx="40" ry="20" />
    <ellipse cx="190" cy="100" rx="40" ry="20" />
    <ellipse cx="170" cy="120" rx="40" ry="20" />
  </g>

  <g class="cloud">
    <ellipse cx="250" cy="70" rx="40" ry="20" />
    <ellipse cx="290" cy="70" rx="40" ry="20" />
    <ellipse cx="270" cy="90" rx="40" ry="20" />
  </g>
</svg>
