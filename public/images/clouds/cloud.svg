<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0F6FF;stop-opacity:1" />
    </linearGradient>

    <!-- Cloud gradient for depth -->
    <radialGradient id="cloudGradient">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </radialGradient>
  </defs>

  <rect width="800" height="400" fill="url(#skyGradient)"/>

  <!-- Large cloud group -->
  <g id="cloud1" transform="translate(100, 80)">
    <path d="M 0,40
             C -20,20 -20,0 0,0
             C 5,-25 35,-30 50,-20
             C 60,-35 90,-35 105,-20
             C 120,-30 150,-25 160,-10
             C 175,-20 200,-15 210,0
             C 230,-10 250,0 250,20
             C 260,10 270,20 265,35
             C 270,50 260,65 240,70
             C 235,85 210,90 190,85
             C 180,95 150,95 130,85
             C 115,90 85,85 70,75
             C 50,80 20,75 5,60
             C -10,65 -20,55 -15,40
             C -20,30 -10,30 0,40
             Z"
          fill="url(#cloudGradient)"
          stroke="#E8E8E8"
          stroke-width="2">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; 20,0; 0,0"
        dur="20s"
        repeatCount="indefinite"/>
    </path>

    <!-- Characteristic Toriyama cloud wisps -->
    <path d="M 50,70 Q 45,85 55,90 Q 65,85 60,75"
          fill="none"
          stroke="#E8E8E8"
          stroke-width="2"
          stroke-linecap="round"/>
    <path d="M 150,75 Q 145,90 155,95 Q 165,90 160,80"
          fill="none"
          stroke="#E8E8E8"
          stroke-width="2"
          stroke-linecap="round"/>
  </g>

  <!-- Medium cloud -->
  <g id="cloud2" transform="translate(450, 120)">
    <path d="M 0,30
             C -15,15 -10,0 5,0
             C 10,-20 35,-25 50,-15
             C 65,-25 90,-20 100,-5
             C 115,-15 135,-10 145,5
             C 160,0 175,10 175,25
             C 185,20 190,35 185,45
             C 190,60 175,70 160,70
             C 155,80 135,80 120,75
             C 105,80 80,75 65,70
             C 45,75 20,70 5,60
             C -10,60 -20,45 -15,35
             C -15,25 -5,25 0,30
             Z"
          fill="url(#cloudGradient)"
          stroke="#E8E8E8"
          stroke-width="2">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; -30,0; 0,0"
        dur="25s"
        repeatCount="indefinite"/>
    </path>

    <!-- Small wisps -->
    <circle cx="30" cy="65" r="3" fill="#E8E8E8"/>
    <circle cx="120" cy="70" r="3" fill="#E8E8E8"/>
  </g>

  <!-- Small fast cloud -->
  <g id="cloud3" transform="translate(600, 200)">
    <path d="M 0,20
             C -10,10 -5,0 5,0
             C 10,-15 30,-15 40,-5
             C 55,-15 70,-10 75,0
             C 90,-5 100,5 100,15
             C 110,15 110,30 100,35
             C 95,45 75,45 60,40
             C 45,45 20,40 10,35
             C -5,35 -10,25 -5,20
             C -5,15 0,15 0,20
             Z"
          fill="#FFFFFF"
          stroke="#E8E8E8"
          stroke-width="2"
          opacity="0.9">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0,0; -100,0; 0,0"
        dur="15s"
        repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Floating small cloud -->
  <g id="cloud4" transform="translate(300, 250)">
    <ellipse cx="0" cy="0" rx="40" ry="20" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="-25" cy="0" rx="25" ry="15" fill="#FFFFFF" opacity="0.7"/>
    <ellipse cx="25" cy="0" rx="25" ry="15" fill="#FFFFFF" opacity="0.7"/>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0,0; 0,-10; 0,0"
      dur="4s"
      repeatCount="indefinite"/>
  </g>

  <!-- Speed lines (characteristic of Toriyama's style) -->
  <g opacity="0.3">
    <line x1="0" y1="150" x2="50" y2="150" stroke="#FFFFFF" stroke-width="2">
      <animate attributeName="x1" values="0;800;0" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="50;850;50" dur="10s" repeatCount="indefinite"/>
    </line>
    <line x1="0" y1="250" x2="80" y2="250" stroke="#FFFFFF" stroke-width="2">
      <animate attributeName="x1" values="0;800;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="80;880;80" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
