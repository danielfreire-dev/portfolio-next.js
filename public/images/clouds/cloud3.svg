<svg
  width="500"
  height="300"
  viewBox="0 0 500 300"
  xmlns="http://www.w3.org/2000/svg"
  style="background: linear-gradient(135deg, #FF9F45 0%, #FFD700 25%, #87CEEB 75%, #E0F7FA 100%);"
>
  <!-- Cloud 1 (Goku-inspired orange tint) -->
  <path
    d="M50,100 Q100,50 150,80 Q200,50 250,100 Q300,150 250,180 Q200,200 150,170 Q100,200 50,150 Z"
    fill="#FFCC99"
    stroke="#FF9933"
    stroke-width="2"
    class="cloud"
    style="animation-delay: 0s;"
  />

  <!-- Cloud 2 (White with soft shadow) -->
  <path
    d="M300,50 Q350,20 400,50 Q450,20 500,70 Q480,120 400,100 Q350,120 300,90 Z"
    fill="white"
    stroke="#DDD"
    stroke-width="2"
    class="cloud"
    style="animation-delay: 1s;"
  />

  <!-- Cloud 3 (Light blue accent) -->
  <path
    d="M100,200 Q150,170 200,200 Q250,170 300,220 Q280,250 200,230 Q150,250 100,220 Z"
    fill="#E6F2FF"
    stroke="#B3D9FF"
    stroke-width="2"
    class="cloud"
    style="animation-delay: 0.5s;"
  />

  <!-- Animation -->
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .cloud {
      animation: float 4s ease-in-out infinite;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.1));
    }
  </style>
</svg>
