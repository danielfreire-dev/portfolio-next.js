<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <!-- Define the Earth's texture as a pattern -->
    <pattern id="earthTexture" patternUnits="userSpaceOnUse" width="200" height="100">
      <image href="data:image/svg+xml;base64," width="200" height="100"/>
    </pattern>

    <!-- Filter for subtle glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Clip path for the circular Earth -->
    <clipPath id="earthClip">
      <circle cx="100" cy="100" r="85"/>
    </clipPath>
  </defs>

  <!-- Animation for rotation -->
  <style>
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .earth-sphere {
      animation: rotate 20s linear infinite;
      transform-origin: center;
    }
    .earth-shadow {
      animation: rotate 20s linear infinite;
      transform-origin: center;
    }
  </style>

  <!-- Earth sphere with texture -->
  <g clip-path="url(#earthClip)">
    <circle cx="100" cy="100" r="85" fill="url(#earthTexture)" class="earth-sphere"/>
  </g>

  <!-- Subtle shadow for depth -->
  <ellipse cx="100" cy="110" rx="85" ry="15" fill="rgba(0,0,0,0.1)" class="earth-shadow"/>
</svg>
