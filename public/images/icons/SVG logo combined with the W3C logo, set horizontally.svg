  <title id="title1">SVG logo combined with the W3C logo, set horizontally</title>
  <desc id="desc1">The logo combines three entities displayed horizontally: the W3C logo with the text 'W3C'; the drawing of a flower or star shape with eight arms; and the text 'SVG'. These three entities are set horizontally.</desc>
