name: Test & Build

on:
  pull_request:
    branches: ["dev", "main"]
  push:
    branches: ["dev", "main"]

permissions:
  contents: read

jobs:
  # ── Static analysis + type checking + unit tests ──────────────────────
  check:
    name: Lint, TypeCheck & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm must be set up before Node so setup-node can cache the pnpm store
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
        continue-on-error: true

  # ── Build verification ────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm must be set up before Node so setup-node can cache the pnpm store
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # Supply dummy values so next build doesn't fail on missing env vars
          RESEND_API_KEY: "re_test_dummy"
          DATA_EMAIL: "test@example.com"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
          TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
          NEXT_PUBLIC_POSTHOG_KEY: "phc_dummy"
          NEXT_PUBLIC_POSTHOG_HOST: "https://app.posthog.com"
          NEXT_PUBLIC_GA4: "G-XXXXXXXXXX"

  # ── E2E tests (Cypress) ───────────────────────────────────────────────
  e2e:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    needs: build
    # Only run on PRs (skip on push to keep CI fast)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm must be set up before Node so setup-node can cache the pnpm store
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Test a production build of the PR: faster and closer to what ships than `next dev`
      - name: Build app
        run: pnpm run build
        env:
          RESEND_API_KEY: "re_test_dummy"
          DATA_EMAIL: "test@example.com"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
          TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"
          NEXT_PUBLIC_POSTHOG_KEY: "phc_dummy"
          NEXT_PUBLIC_POSTHOG_HOST: "https://app.posthog.com"
          NEXT_PUBLIC_GA4: "G-XXXXXXXXXX"

      # Start the server ourselves and poll it: the action's built-in wait-on
      # aborted instantly ("Socket closed before the connection was established")
      - name: Start app and wait until it responds
        run: |
          nohup pnpm start > next-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/en; then
              echo "Server ready after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "Server did not respond within 120s"; cat next-server.log; exit 1
        env:
          RESEND_API_KEY: "re_test_dummy"
          DATA_EMAIL: "test@example.com"
          TURNSTILE_SECRET_KEY: "1x0000000000000000000000000000000AA"

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          browser: chrome

      - name: Show server log (on failure)
        if: failure()
        run: cat next-server.log || true

      - name: Upload E2E screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7

      - name: Upload E2E videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7
