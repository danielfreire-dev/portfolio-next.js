name: Tests for Next.js app

on:
  pull_request:
    branches: ["dev"]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tests:
    name: Tests for Next.js app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Run lint tests
        run: pnpm run lint || true
        continue-on-error: true

      - name: Fix lint
        run: pnpm run lint-fix || true
        continue-on-error: true

      - name: Run tests
        run: pnpm run test
