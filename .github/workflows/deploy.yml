name: Deploy to Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Only deploy if lint + typecheck + tests passed (these run in parallel via test.yml)
    # For true gating, configure branch protection rules on main in repo settings.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DATA_EMAIL: ${{ secrets.DATA_EMAIL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_GA4: ${{ secrets.NEXT_PUBLIC_GA4 }}

      # ── Option A: Deploy to Vercel via CLI ──
      # Uncomment and set VERCEL_ORG_ID, VERCEL_PROJECT_ID in repo secrets.
      # Also add VERCEL_TOKEN (personal access token).
      #
      # - name: Deploy to Vercel (Production)
      #   run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
      #   env:
      #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── Option B: Vercel GitHub Integration (recommended) ──
      # Vercel auto-deploys on push to main when the repo is linked.
      # No GitHub Actions step needed — configure at vercel.com.
      # This workflow still provides a pre-deploy quality gate (lint/type/test/build).
